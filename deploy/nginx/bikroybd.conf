# ============================================================================
# Recycl Rangpur — Production Nginx Reverse Proxy & HTTPS Configuration
# Architecture:
#   1. User Marketplace Domain: https://recyclrangpur.com (User-only, /admin blocked)
#   2. Separate Admin Domain:   https://admin.recyclrangpur.com (Dedicated Admin Portal)
# ============================================================================

limit_req_zone $binary_remote_addr zone=bikroybd_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=bikroybd_auth_limit:10m rate=2r/s;

upstream bikroybd_api_upstream {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

# 1. HTTP (Port 80) -> ACME Challenge + Permanent HTTPS (301) Redirect
server {
    listen 80;
    listen [::]:80;
    server_name recyclrangpur.com www.recyclrangpur.com admin.recyclrangpur.com;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Redirect www.recyclrangpur.com -> Canonical recyclrangpur.com over HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.recyclrangpur.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/recyclrangpur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recyclrangpur.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/recyclrangpur.com/chain.pem;

    return 301 https://recyclrangpur.com$request_uri;
}

# 3. USER MARKETPLACE SERVER (https://recyclrangpur.com — Strictly User Only, No Admin Panel)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recyclrangpur.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/recyclrangpur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recyclrangpur.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/recyclrangpur.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 26M;
    root /var/www/bikroybd/current/client/dist;
    index index.html;

    # Block any /admin or /api/v1/admin requests on the public User Domain
    location ~ ^/(admin|api/v1/admin) {
        return 404;
    }

    location ~ ^/api/v1/auth/(login|register|refresh) {
        limit_req zone=bikroybd_auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://bikroybd_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        limit_req zone=bikroybd_api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://bikroybd_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

# 4. SEPARATE ADMIN PORTAL SERVER (https://admin.recyclrangpur.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.recyclrangpur.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/recyclrangpur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recyclrangpur.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/recyclrangpur.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/bikroybd/current/client/dist;
    index index.html;

    location /api/v1/ {
        limit_req zone=bikroybd_api_limit burst=20 nodelay;
        proxy_pass http://bikroybd_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
